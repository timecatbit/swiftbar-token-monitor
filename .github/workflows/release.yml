# The release is published only after the SwiftBar ZIP, both Mac DMGs and the Windows installer pass.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    # The glass panel needs the macOS 26 SDK (Xcode 26).
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check the macOS SDK
        run: |
          xcrun swiftc --version
          sdk=$(xcrun --show-sdk-version)
          echo "macOS SDK $sdk"
          [ "${sdk%%.*}" -ge 26 ]
      - name: Run checks
        run: python3 scripts/check.py
      - name: Package
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            python3 scripts/package.py --tag "$GITHUB_REF_NAME"
          else
            python3 scripts/package.py
          fi
      - name: Install the package into an empty plugin folder
        run: |
          scratch="$RUNNER_TEMP/install-test"
          mkdir -p "$scratch/home" "$scratch/plugins" "$scratch/unpacked"
          ditto -x -k dist/token-monitor-*.zip "$scratch/unpacked"
          # No source checkout, no compiler step: the installer must work from the unpacked zip alone.
          HOME="$scratch/home" python3 "$scratch"/unpacked/token-monitor-*/install.py --plugin-dir "$scratch/plugins" --no-refresh
          [ "$(ls "$scratch/plugins")" = token-monitor.30s.sh ]
          test -x "$scratch/plugins/token-monitor.30s.sh"
          codesign --verify --deep --strict "$scratch/plugins/.opencodex-panel/OpenCodexPanel.app"
          ls "$scratch/plugins/.opencodex-panel/python/"*/curl_cffi > /dev/null
          if matches=$(grep -rlF -e "$GITHUB_WORKSPACE" -e "$scratch/unpacked" "$scratch/plugins"); then
            echo 'The installed plugin refers to the package or source folder:'
            for file in $matches; do echo "$file"; grep -aoF -e "$GITHUB_WORKSPACE" -e "$scratch/unpacked" "$file" | sort -u | head -3; done
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: token-monitor-package
          path: dist/
  windows:
    uses: ./.github/workflows/windows.yml
    with:
      expected-tag: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
    permissions:
      contents: read

  macos-dmg:
    uses: ./.github/workflows/macos-dmg.yml
    with:
      expected-tag: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
    permissions:
      contents: read

  publish:
    if: github.event_name == 'push'
    needs: [package, macos-dmg, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: token-monitor-package
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: token-monitor-windows-x64
          path: dist
      - uses: actions/download-artifact@v4
        with:
          pattern: token-monitor-macos-*
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Existing in-app updates still fetch the legacy basename. The labelled
          # copy gives first-time users an unambiguous choice in the assets list.
          plugin="TokenMonitor-$version-macOS-SwiftBar-Plugin.zip"
          cp "dist/token-monitor-$version.zip" "dist/$plugin"
          (cd dist && sha256sum "$plugin" > "$plugin.sha256")
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Token Monitor $version · Mac / Windows" \
            --notes-file dist/release-notes.md \
            "dist/TokenMonitor-$version-macOS-AppleSilicon-arm64.dmg#macOS · Apple 芯片独立版预览（未公证）" "dist/TokenMonitor-$version-macOS-AppleSilicon-arm64.dmg.sha256" \
            "dist/TokenMonitor-$version-macOS-Intel-x64.dmg#macOS · Intel 独立版预览（未公证）" "dist/TokenMonitor-$version-macOS-Intel-x64.dmg.sha256" \
            "dist/$plugin#macOS · SwiftBar 插件（Apple 芯片／Intel 通用）" "dist/$plugin.sha256" \
            "dist/token-monitor-$version.zip#兼容文件 · SwiftBar 旧版自动更新用" "dist/token-monitor-$version.zip.sha256#兼容校验 · SwiftBar 旧版自动更新用" \
            "dist/token-monitor-$version-windows-x64.zip#Windows x64 · 免安装版（解压运行）" "dist/token-monitor-$version-windows-x64.zip.sha256" \
            "dist/token-monitor-$version-windows-x64-setup.exe#Windows x64 · 安装程序（推荐）" "dist/token-monitor-$version-windows-x64-setup.exe.sha256"
