# The release is published only after the SwiftBar ZIP, both Mac DMGs and the Windows installer pass.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    # The glass panel needs the macOS 26 SDK (Xcode 26).
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check the macOS SDK
        run: |
          xcrun swiftc --version
          sdk=$(xcrun --show-sdk-version)
          echo "macOS SDK $sdk"
          [ "${sdk%%.*}" -ge 26 ]
      - name: Run checks
        run: python3 scripts/check.py
      - name: Package
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            python3 scripts/package.py --tag "$GITHUB_REF_NAME"
          else
            python3 scripts/package.py
          fi
      - name: Install the package into an empty plugin folder
        run: |
          scratch="$RUNNER_TEMP/install-test"
          mkdir -p "$scratch/home" "$scratch/plugins" "$scratch/unpacked"
          ditto -x -k dist/token-monitor-*.zip "$scratch/unpacked"
          # No source checkout, no compiler step: the installer must work from the unpacked zip alone.
          HOME="$scratch/home" python3 "$scratch"/unpacked/token-monitor-*/install.py --plugin-dir "$scratch/plugins" --no-refresh
          [ "$(ls "$scratch/plugins")" = token-monitor.30s.sh ]
          test -x "$scratch/plugins/token-monitor.30s.sh"
          codesign --verify --deep --strict "$scratch/plugins/.opencodex-panel/OpenCodexPanel.app"
          ls "$scratch/plugins/.opencodex-panel/python/"*/curl_cffi > /dev/null
          if matches=$(grep -rlF -e "$GITHUB_WORKSPACE" -e "$scratch/unpacked" "$scratch/plugins"); then
            echo 'The installed plugin refers to the package or source folder:'
            for file in $matches; do echo "$file"; grep -aoF -e "$GITHUB_WORKSPACE" -e "$scratch/unpacked" "$file" | sort -u | head -3; done
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: token-monitor-package
          path: dist/
  windows:
    uses: ./.github/workflows/windows.yml
    with:
      expected-tag: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
    permissions:
      contents: read

  macos-dmg:
    uses: ./.github/workflows/macos-dmg.yml
    with:
      expected-tag: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
    permissions:
      contents: read

  publish:
    if: github.event_name == 'push'
    needs: [package, macos-dmg, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: token-monitor-package
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: token-monitor-windows-x64
          path: dist
      - uses: actions/download-artifact@v4
        with:
          pattern: token-monitor-macos-*
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # scripts/package.py lists the five downloads as file#label: GitHub shows the label in place of the
          # file name and its own SHA-256 beside each file, so no checksum files are uploaded.
          assets=()
          while IFS= read -r asset; do
            test -f "dist/${asset%%#*}"
            assets+=("dist/$asset")
          done < dist/release-assets.txt
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Token Monitor ${GITHUB_REF_NAME#v}" \
            --notes-file dist/release-notes.md "${assets[@]}"
