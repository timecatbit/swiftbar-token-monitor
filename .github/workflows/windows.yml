name: Windows tray

# Releases need this build, and main takes direct pushes, so it runs on every push that can break it
# rather than first surfacing at a tag.
on:
  push:
    branches: [main]
    paths:
      - "windows/**"
      - "lib/**"
      - "assets/**"
      - "token-monitor.30s.sh"
      - "tests/test_windows.py"
      - ".github/workflows/windows.yml"
  pull_request:
    paths:
      - "windows/**"
      - "lib/**"
      - "assets/**"
      - "token-monitor.30s.sh"
      - "tests/test_windows.py"
      - ".github/workflows/windows.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      expected-tag:
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  tray:
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
      # Offscreen Qt reads fonts from this folder instead of asking Windows.
      QT_QPA_FONTDIR: C:\Windows\Fonts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
      - name: Install build dependencies
        run: python -m pip install -r windows/requirements.txt pyinstaller==6.16.0
      - name: Verify Windows adapters and panel
        run: python -m unittest discover -s tests -p test_windows.py -v
      - name: Build and smoke test the standalone exe
        env:
          EXPECTED_TAG: ${{ inputs.expected-tag }}
        run: ./windows/build.ps1 -ExpectedTag $env:EXPECTED_TAG
      - uses: actions/upload-artifact@v4
        with:
          name: token-monitor-windows-x64
          path: |
            dist/*-windows-x64.zip
            dist/*-windows-x64.zip.sha256
            dist/*-windows-x64-setup.exe
            dist/*-windows-x64-setup.exe.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: token-monitor-windows-smoke
          path: |
            build/windows/smoke.png
            build/windows/setup.log
          if-no-files-found: error
